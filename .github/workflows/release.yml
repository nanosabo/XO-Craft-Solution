name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.0.2)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build solver
        run: yarn solver:build

      - name: Build app
        run: yarn build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/latest*.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The runner starts bash with -e, so disable it explicitly: every
          # command below reports its own error instead of aborting the step.
          set -u +e
          summary="$GITHUB_STEP_SUMMARY"

          {
            echo "## Release $TAG"
            echo "### Files"
            echo '```'
            ls -la artifacts
            echo '```'
            echo "### Releases before"
            echo '```'
            gh release list --limit 20 2>&1 || true
            echo '```'
          } >> "$summary"

          # A previous attempt may have left a draft behind.
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" 2>>"$summary")
          echo "Leftover draft id: ${release_id:-none}" >> "$summary"

          if [ -n "$release_id" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" >>"$summary" 2>&1
          fi

          # electron-builder writes space-free names into latest*.yml, but GitHub
          # replaces spaces in uploaded file names with dots. Rename the files
          # here so the uploaded assets match the names electron-updater requests.
          for file in artifacts/*; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            safe=${base// /-}
            if [ "$base" != "$safe" ]; then
              mv -- "$file" "$(dirname "$file")/$safe"
            fi
          done

          # Fail before uploading if a manifest points at a missing file.
          for name in $(grep -hE '^  - url: |^path: ' artifacts/latest*.yml |
              sed -E 's/^  - url: //; s/^path: //' | sort -u); do
            if [ ! -f "artifacts/$name" ]; then
              echo "Manifest references missing artifact: $name" >> "$summary"
              exit 1
            fi
          done

          args=(--draft --title "$TAG" --generate-notes --target "$GITHUB_SHA")
          is_prerelease=false
          case "$TAG" in
            *-*)
              args+=(--prerelease)
              is_prerelease=true
              ;;
          esac

          if ! output=$(gh release create "$TAG" artifacts/* "${args[@]}" 2>&1); then
            {
              echo "### Release failed"
              echo '```'
              echo "$output"
              echo '```'
            } >> "$summary"
            exit 1
          fi

          echo "$output" >> "$summary"

          # Publish only after every asset is uploaded, so electron-updater
          # never sees a release with missing files. Stable releases also
          # become the repository's "latest" release.
          publish_args=(--draft=false)
          if [ "$is_prerelease" = false ]; then
            publish_args+=(--latest)
          fi

          if ! publish_output=$(gh release edit "$TAG" "${publish_args[@]}" 2>&1); then
            {
              echo "### Publishing failed"
              echo '```'
              echo "$publish_output"
              echo '```'
            } >> "$summary"
            exit 1
          fi

          echo "$publish_output" >> "$summary"
